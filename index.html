<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="京阪">
<meta name="theme-color" content="#F4EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F4EFE7'/%3E%3Cpath d='M7 15 Q32 9 57 15 L56 21 Q32 16 8 21Z' fill='%23C2412D'/%3E%3Crect x='13' y='27' width='38' height='5' fill='%23C2412D'/%3E%3Crect x='18' y='19' width='6' height='38' fill='%23C2412D'/%3E%3Crect x='40' y='19' width='6' height='38' fill='%23C2412D'/%3E%3Crect x='30' y='20' width='4' height='8' fill='%23C2412D'/%3E%3C/svg%3E">
<title>京阪之旅</title>
<style>
  :root{
    --paper:#F4EFE7;
    --panel:#FFFDFA;
    --card:#FFFFFF;
    --ink:#22201E;
    --muted:#77706A;
    --rule:#DED5C7;
    --line:rgba(222,213,199,.7);
    --grid:rgba(34,32,30,.04);
    --ai:#2E4A6B;
    --ai-soft:rgba(46,74,107,.08);
    --on-ai:#FFFFFF;
    --shu:#C2412D;
    --shu-soft:rgba(194,65,45,.08);
    --kin:#B08A3E;
    --kin-ink:#8A6A28;
    --kin-soft:rgba(176,138,62,.11);
    --ink-soft:rgba(34,32,30,.05);
    --ok:#557A3C;
    --mark:#E0301E;
    --scrim:rgba(20,18,16,.55);
    --shadow:0 1px 0 rgba(34,32,30,.05), 0 8px 22px -14px rgba(34,32,30,.3);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",var(--sans);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#161412;
      --panel:#201D1A;
      --card:#2A2622;
      --ink:#EEE7DC;
      --muted:#A39A8F;
      --rule:#3A3530;
      --line:rgba(58,53,48,.9);
      --grid:rgba(255,255,255,.025);
      --ai:#93B4DC;
      --ai-soft:rgba(147,180,220,.12);
      --on-ai:#10161F;
      --shu:#E3705A;
      --shu-soft:rgba(227,112,90,.13);
      --kin:#D2AA5C;
      --kin-ink:#D2AA5C;
      --kin-soft:rgba(210,170,92,.13);
      --ink-soft:rgba(255,255,255,.06);
      --ok:#8DB867;
      --mark:#FF5A47;
      --scrim:rgba(0,0,0,.66);
      --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) 0 calc(48px + env(safe-area-inset-bottom));
  }
  body.locked{overflow:hidden}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  a{color:var(--ai)}
  button{font:inherit}

  /* ---- header ---- */
  header{padding:26px 0 16px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap
  }
  .eyebrow b{color:var(--shu);font-weight:600}
  .hero{display:flex;align-items:stretch;margin-top:10px;border-top:2px solid var(--shu)}
  .h1{flex:1.3;padding:12px 16px 6px 0}
  .h2{flex:1;padding:12px 0 6px 16px;border-left:1px solid var(--rule)}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .title{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:6px}
  .title small{display:block;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.08em;color:var(--muted);margin-top:6px}
  .n{
    font-family:var(--mono);font-size:58px;line-height:.9;font-weight:600;letter-spacing:-.05em;
    font-variant-numeric:tabular-nums;color:var(--shu);margin-top:6px
  }
  .n span{font-size:14px;letter-spacing:0;margin-left:5px;color:var(--muted);font-weight:400}
  .n.live{font-size:30px;line-height:1.1;color:var(--ai)}
  .n.over{font-size:26px;line-height:1.2;color:var(--muted)}
  .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:8px;line-height:1.7}

  /* ---- tabs ---- */
  nav{
    position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--rule);display:flex;gap:0;margin-bottom:16px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:1 1 0;min-width:0;appearance:none;border:0;background:none;font-family:var(--mono);
    padding:11px 2px 10px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
    margin-bottom:-1px;line-height:1.25;touch-action:manipulation
  }
  nav button b{display:block;font-size:12.5px;letter-spacing:.1em;font-weight:600}
  nav button small{display:block;font-size:10px;letter-spacing:.04em;margin-top:2px}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu)}
  nav button.today b::after{content:"•";color:var(--shu);margin-left:3px}
  nav button:focus-visible{outline:2px solid var(--ai);outline-offset:-4px}

  /* ---- panel ---- */
  .panel{
    background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden
  }
  .panel > .head{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:12px 15px;border-bottom:1px solid var(--rule)
  }
  .panel > .head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .panel > .head h2 small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.08em;margin-right:8px}
  .panel > .head .cnt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
  .panel > .head .cnt b{color:var(--ok);font-weight:600}

  /* ---- today card ---- */
  .today{border-color:var(--shu);border-width:1.5px}
  .today > .head{background:var(--shu-soft)}
  .today .nowrow{display:flex;gap:10px;align-items:baseline;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13.5px}
  .today .nowrow .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);flex:none}
  .today .nowrow .v{min-width:0}
  .today .nowrow .v span{font-family:var(--mono);font-size:11px;color:var(--shu);margin-right:6px}
  .today .nx{padding:13px 15px 14px}
  .today .nx .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--shu);font-weight:600}
  .today .nx .t{font-family:var(--mono);font-size:12px;color:var(--shu);font-weight:600;margin-top:6px}
  .today .nx .nm{font-size:19px;font-weight:700;line-height:1.3;margin-top:2px;letter-spacing:-.01em}
  .today .nx .sb{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .today .nx .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .today .nx .acts .go{grid-column:1/-1}
  .today .done{padding:14px 15px;font-size:14px;color:var(--muted)}
  .today .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}

  /* ---- timeline items ---- */
  .list{padding:4px 0}
  .it{
    display:grid;grid-template-columns:24px 40px 1fr;gap:0 12px;align-items:start;
    padding:13px 15px;border-bottom:1px solid var(--line);position:relative
  }
  .it:last-child{border-bottom:0}
  .it.now{background:var(--shu-soft)}
  .it.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--shu)}
  .it .box{
    position:relative;width:22px;height:22px;border:1.5px solid var(--rule);border-radius:4px;margin-top:9px;
    display:grid;place-items:center;cursor:pointer;background:var(--card);transition:background .12s,border-color .12s;
    touch-action:manipulation;flex:none
  }
  .it .box::after{content:"";position:absolute;inset:-12px}
  .it .box svg{width:13px;height:13px;opacity:0;transform:scale(.7);transition:.14s}
  .it[data-on="1"] .box{background:var(--ok);border-color:var(--ok)}
  .it[data-on="1"] .box svg{opacity:1;transform:scale(1)}
  .it[data-on="1"] .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(119,112,106,.5)}
  .it .ic{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;
    background:var(--ai-soft);border:1px solid rgba(46,74,107,.15);flex:none
  }
  .it .ic.food{background:var(--shu-soft);border-color:rgba(194,65,45,.2)}
  .it .ic.stay{background:var(--kin-soft);border-color:rgba(176,138,62,.25)}
  .it .ic.move{background:var(--ink-soft);border-color:var(--rule)}
  .it .c{min-width:0}
  .it .t{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--shu);font-weight:600;margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .it .t.none{display:none}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;padding:2px 6px;border-radius:3px;font-weight:700;line-height:1.2}
  .tag.now{background:var(--shu);color:#fff}
  .tag.next{border:1px solid var(--shu);color:var(--shu)}
  .it .nm{font-size:15.5px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
  .ln{
    display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ai);
    border:1px solid var(--ai);border-radius:3px;padding:2px 6px;margin-top:5px;line-height:1.3;opacity:.9
  }
  .it .sb{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .pill{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
    min-height:34px;padding:7px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);
    text-decoration:none;line-height:1;touch-action:manipulation;white-space:nowrap;cursor:pointer;appearance:none
  }
  .pill svg{width:13px;height:13px;flex:none}
  .pill.go{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-weight:600}
  .pill.map{border-color:var(--ai);color:var(--ai)}
  .pill.rt{border-color:var(--lc,var(--ai));color:var(--ink);background:var(--card)}
  .pill.rt i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lc,var(--ai));flex:none}
  .pill.tel{border-color:var(--ok);color:var(--ok)}
  .pill.web{border-color:var(--kin);color:var(--kin-ink)}
  .pill.drv{border-color:var(--kin);color:var(--kin-ink)}
  .pill:active{transform:translateY(1px)}
  .big{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;font-size:13px;border-radius:10px;padding:10px 12px;white-space:normal;text-align:center}
  .big svg{width:15px;height:15px}
  .or{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
    align-self:center;padding:0 2px
  }

  /* ---- info tab ---- */
  .kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
  .kv:last-child{border-bottom:0}
  .kv .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-top:3px}
  .kv .v b{font-weight:600}
  .kv .v .acts{margin-top:8px}
  .kv .v em{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:2px}
  .kv .v .jp{font-family:var(--jp)}
  .flight{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em}
  .flight .arrow{color:var(--muted);font-weight:400}
  .note{font-size:12.5px;color:var(--muted);line-height:1.7;padding:12px 15px}
  .note b{color:var(--ink);font-weight:600}
  .note p{margin:0 0 8px}
  .note p:last-child{margin:0}
  .btn{
    appearance:none;border:1px solid var(--rule);background:var(--card);border-radius:3px;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:8px 12px;cursor:pointer;color:var(--ink)
  }

  /* ---- yen converter ---- */
  .conv{padding:14px 15px}
  .conv .row{display:flex;align-items:center;gap:10px}
  .conv .fx{flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:10px;padding:0 12px;background:var(--card);min-height:52px}
  .conv .fx span{font-family:var(--mono);font-size:18px;color:var(--muted)}
  .conv input{appearance:none;border:0;background:none;color:var(--ink);font:600 22px var(--mono);width:100%;min-width:0;outline:none;padding:10px 0}
  .conv .eq{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:12px}
  .conv .eq b{font-size:28px;color:var(--ink);letter-spacing:-.02em;margin-left:4px}
  .conv .ref{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .conv .ref span{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card)}
  .conv .rate{display:flex;align-items:center;gap:6px;margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .conv .rate input{font-size:13px;font-weight:600;width:84px;border:1px solid var(--rule);border-radius:6px;padding:5px 7px;background:var(--card)}

  /* ---- sheet (route map / driver card) ---- */
  .sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-card{
    position:relative;background:var(--panel);width:100%;max-width:560px;max-height:90vh;overflow:auto;
    border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);-webkit-overflow-scrolling:touch
  }
  @media (min-width:640px){ .sheet{align-items:center} .sheet-card{border-radius:14px} }
  .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
  .sh-head{display:flex;gap:12px;align-items:center;padding-right:46px}
  .sh-head .lc{width:10px;align-self:stretch;border-radius:4px;background:var(--lc);flex:none}
  .sh-t{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .sh-s{font-size:13px;color:var(--ink);margin-top:3px}
  .sh-s b{color:var(--mark)}
  .sh-meta{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
  .route{list-style:none;margin:8px 0 0;padding:0}
  .st{position:relative;display:grid;grid-template-columns:48px 1fr;align-items:center;min-height:50px}
  .st::before{content:"";position:absolute;left:22px;width:4px;top:0;bottom:0;background:var(--lc)}
  .st:first-child::before{top:50%}
  .st:last-child::before{bottom:50%}
  .route.omit .st:not(.ext)::before{background:repeating-linear-gradient(var(--lc) 0 7px, transparent 7px 11px)}
  .st.ext::before{background:repeating-linear-gradient(var(--lc) 0 4px, transparent 4px 8px);opacity:.4}
  .st .mk{position:relative;justify-self:center;width:16px;height:16px;border-radius:50%;background:var(--panel);border:3.5px solid var(--lc);z-index:1}
  .st.ext .mk{opacity:.45;width:12px;height:12px;border-width:3px}
  .st.from .mk,.st.to .mk{width:20px;height:20px;border-width:5px}
  .st.from .mk::after,.st.to .mk::after{content:"";position:absolute;inset:-10px;border:3px solid var(--mark);border-radius:50%}
  .snm{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 0}
  .snm .nmw{display:inline-flex;flex-direction:column;padding:3px 0}
  .snm b{font-family:var(--jp);font-size:16px;font-weight:600;line-height:1.25}
  .snm small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
  .st.ext .snm b{font-size:13px;font-weight:400;color:var(--muted)}
  .st.from .nmw,.st.to .nmw{border:3px solid var(--mark);border-radius:14px;padding:5px 14px}
  .st.from .snm b,.st.to .snm b{font-size:19px;font-weight:700}
  .badge{font-size:11.5px;font-weight:700;color:#fff;background:var(--mark);border-radius:4px;padding:3px 7px;flex:none;letter-spacing:.05em}
  .st.ext .dir{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .sh-note{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .sh-note b{color:var(--ink)}

  .drv{padding:6px 2px 4px}
  .drv .lbl{font-size:11px}
  .drv .jpn{font-family:var(--jp);font-size:32px;font-weight:800;line-height:1.25;margin-top:14px;letter-spacing:.01em}
  .drv .addr{font-family:var(--jp);font-size:19px;line-height:1.55;margin-top:12px}
  .drv .ask{font-family:var(--jp);font-size:24px;font-weight:700;margin-top:18px;padding-top:14px;border-top:2px solid var(--shu);color:var(--shu)}
  .drv .zh{font-size:12.5px;color:var(--muted);margin-top:6px}

  footer{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:center;padding:20px 0 0;text-transform:uppercase}

  @media (max-width:520px){
    .title{font-size:28px}
    .n{font-size:46px}
    .h1{padding-right:12px}.h2{padding-left:12px}
    .it{grid-template-columns:22px 36px 1fr;gap:0 10px;padding:13px 13px}
    .it .ic{width:36px;height:36px;font-size:18px}
    .kv{grid-template-columns:1fr;gap:4px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow"><b>KYOTO · OSAKA · 京阪</b><span>2026 · 12/8 – 12/12 · 5 天 4 夜</span></div>
  <div class="hero">
    <div class="h1">
      <div class="lbl">京都・大阪</div>
      <div class="title">京阪之旅<small>京都 2 晚 · 大阪 2 晚</small></div>
    </div>
    <div class="h2">
      <div class="lbl" id="cdl">距離出發</div>
      <div class="n" id="cd">—<span>天</span></div>
      <div class="sub" id="cds">12 / 8（二）出發</div>
    </div>
  </div>
</header>

<nav id="nav" aria-label="行程日期"></nav>

<main id="view"></main>

<footer>Kyoto · Osaka 2026 · 點勾勾記錄完成 · 左右滑動換天</footer>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-card"><button class="x" data-close aria-label="關閉">×</button><div id="sheetBody"></div></div>
</div>

<script>
/* ================= 資料 ================= */

/* 日本時間；網址加 ?now=2026-12-10T13:20 可模擬旅途中的某個時刻 */
const SIM=(()=>{ try{ const m=location.search.match(/now=(\d{4}-\d{2}-\d{2})T(\d{1,2}):(\d{2})/); if(m) return {date:m[1], min:+m[2]*60+ +m[3]} }catch(e){} return null })();
function jpNow(){
  if(SIM) return SIM;
  const p={};
  new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).forEach(x=>{ p[x.type]=x.value });
  return {date:p.year+'-'+p.month+'-'+p.day, min:(+p.hour%24)*60+ +p.minute};
}
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5) }
function startMin(t){
  if(!t) return null;
  const m=t.match(/(\d{1,2}):(\d{2})/); if(m) return +m[1]*60+ +m[2];
  return t.includes('中午') ? 720 : null;
}
function todayIdx(){ const d=jpNow().date; return TRIP.findIndex(x=>x.date===d) }
function hotelAt(day,min){ let h=null; (day.stay||[]).forEach(([k,from])=>{ if(min>=from) h=k }); return h }

/* 現在進行中 / 下一站：以時間為準，已勾選的會自動往下推 */
function progress(i,min){
  const items=TRIP[i].items; let base=-1;
  items.forEach((it,j)=>{ const s=startMin(it.t); if(s!==null && s<=min) base=j });
  let cur=base;
  while(cur>=0 && cur<items.length && DONE[i+'-'+cur]) cur++;
  if(cur>=items.length) return {cur:-1,next:-1,all:true};
  let next=cur<0?0:cur+1;
  while(next<items.length && DONE[i+'-'+next]) next++;
  if(next>=items.length) next=-1;
  return {cur,next,all:false};
}

/* ================= 倒數 ================= */
function countdown(){
  const now=jpNow(), t=now.date, first=TRIP[0].date, last=TRIP[TRIP.length-1].date;
  const el=document.getElementById('cd'), lbl=document.getElementById('cdl'), sub=document.getElementById('cds');
  const toStart=dayDiff(t,first);
  if(toStart>0){
    lbl.textContent='距離出發'; el.className='n'; el.innerHTML=toStart+'<span>天</span>';
    sub.textContent=TRIP[0].d.replace('/',' / ')+'（'+TRIP[0].w+'）出發';
  }else if(dayDiff(t,last)>=0){
    const n=dayDiff(first,t)+1;
    lbl.textContent='旅程進行中'; el.className='n live'; el.innerHTML='DAY '+n+'<span>/ '+TRIP.length+'</span>';
    sub.textContent=TRIP[n-1].d+'（'+TRIP[n-1].w+'）'+TRIP[n-1].title+' · 日本 '+hhmm(now.min);
  }else{
    lbl.textContent='旅程結束'; el.className='n over'; el.textContent='歡迎回家';
    sub.textContent='下次再去！';
  }
}

function pillTel(tel,big){ return '<a class="pill tel'+(big?' big':'')+'" href="tel:'+tel.replace(/[^0-9+]/g,'')+'">'+PHONE+esc(tel)+'</a>' }
function pillWeb(url,label,big){ return '<a class="pill web'+(big?' big':'')+'" target="_blank" rel="noopener" href="'+esc(url)+'">'+LINK+esc(label)+'</a>' }
function pillRt(key,big){ return '<button class="pill rt'+(big?' big':'')+'" data-rt="'+key+'" style="--lc:'+ROUTES[key].color+'"><i></i>路線圖</button>' }
function pillDrv(key,big){ return '<button class="pill drv'+(big?' big':'')+'" data-drv="'+key+'">🚕 給司機看</button>' }

function itemActs(it,big){
  let a='';
  const dest=it.nav===false?null:(it.to||it.q);
  if(dest) a+=pillGo(dest,it.mode,it.tl?'導航到 '+it.tl:'導航',big);
  if(it.rt) a+=pillRt(it.rt,big);
  if(it.q) a+=pillMap(it.q,it.ql,big);
  if(it.more) it.more.forEach(m=>{ a+=pillMap(m.q,m.nm,big) });
  if(it.stay) a+=pillDrv(it.stay,big);
  if(it.url) a+=pillWeb(it.url,it.ul||'網站',big);
  if(it.tel) a+=pillTel(it.tel,big);
  return a;
}

/* ================= 分頁 ================= */
let CUR=0;
function renderNav(){
  const t=jpNow().date;
  const nav=document.getElementById('nav'); nav.innerHTML='';
  TRIP.forEach((day,i)=>{
    const b=document.createElement('button');
    b.innerHTML='<b>D'+(i+1)+'</b><small>'+day.d+' '+day.w+'</small>';
    b.setAttribute('aria-selected', i===CUR?'true':'false');
    if(day.date===t) b.classList.add('today');
    b.onclick=()=>go(i);
    nav.appendChild(b);
  });
  const b=document.createElement('button');
  b.innerHTML='<b>INFO</b><small>住宿・工具</small>';
  b.setAttribute('aria-selected', CUR===TRIP.length?'true':'false');
  b.onclick=()=>go(TRIP.length);
  nav.appendChild(b);
}

function renderToday(i,now,pr){
  const day=TRIP[i], hk=hotelAt(day,now.min);
  let h='<div class="panel today"><div class="head"><h2><small>TODAY</small>日本時間 '+hhmm(now.min)+'</h2>'+
        '<span class="cnt">DAY '+(i+1)+' / '+TRIP.length+'</span></div>';
  if(pr.cur>=0){
    const c=day.items[pr.cur];
    h+='<div class="nowrow"><span class="k">進行中</span><span class="v">'+(c.t?'<span>'+esc(c.t)+'</span>':'')+esc(c.nm)+'</span></div>';
  }
  if(pr.next>=0){
    const n=day.items[pr.next];
    h+='<div class="nx"><div class="k">下一站 NEXT</div>'+
       (n.t?'<div class="t">'+esc(n.t)+'</div>':'')+
       '<div class="nm">'+esc(n.nm)+'</div>'+
       (n.ln?'<div class="ln">'+esc(n.ln)+'</div>':'')+
       (n.sb?'<div class="sb">'+esc(n.sb)+'</div>':'')+
       '<div class="acts">'+itemActs(n,true)+'</div></div>';
  }else{
    h+='<div class="done">'+(pr.all?'今天的行程都完成了 🎉':'今天沒有下一站了，好好休息！')+'</div>';
  }
  if(hk){
    const H=HOTELS[hk];
    h+='<div class="quick">'+pillGo(H.q,'transit','回飯店',true)+pillDrv(hk,true)+'</div>';
  }
  return h+'</div>';
}

function renderDay(i){
  const day=TRIP[i], now=jpNow(), isToday=day.date===now.date;
  const pr=isToday?progress(i,now.min):{cur:-1,next:-1};
  const total=day.items.length, done=day.items.filter((_,j)=>DONE[i+'-'+j]).length;
  let h=isToday?renderToday(i,now,pr):'';
  h+='<div class="panel"><div class="head"><h2><small>'+day.d+'（'+day.w+'）</small>'+esc(day.title)+'</h2>'+
     '<span class="cnt"><b>'+done+'</b> / '+total+' 完成</span></div><div class="list">';
  day.items.forEach((it,j)=>{
    const id=i+'-'+j, on=DONE[id]?'1':'0';
    const st=j===pr.cur?'now':j===pr.next?'next':'';
    const tag=st==='now'?'<span class="tag now">NOW</span>':st==='next'?'<span class="tag next">NEXT</span>':'';
    const acts=itemActs(it,false);
    h+='<div class="it'+(st==='now'?' now':'')+'" data-on="'+on+'" data-id="'+id+'">'+
       '<div class="box" role="checkbox" aria-checked="'+(on==='1')+'" tabindex="0" aria-label="標記完成">'+CHECK+'</div>'+
       '<div class="ic '+it.k+'">'+it.ic+'</div>'+
       '<div class="c">'+
         '<div class="t'+(it.t||tag?'':' none')+'">'+(it.t?esc(it.t):'')+tag+'</div>'+
         '<div class="nm">'+esc(it.nm)+'</div>'+
         (it.ln?'<div class="ln">'+esc(it.ln)+'</div>':'')+
         (it.sb?'<div class="sb">'+esc(it.sb)+'</div>':'')+
         (acts?'<div class="acts">'+acts+'</div>':'')+
       '</div></div>';
  });
  h+='</div></div>';
  return h;
}

/* ================= 日幣換算 ================= */
let RATE=null;
function loadRate(){ try{ return JSON.parse(localStorage.getItem(RKEY)||'null') }catch(e){ return null } }
function fmtNT(v){ return v>=100 ? Math.round(v).toLocaleString('zh-TW') : (Math.round(v*10)/10).toLocaleString('zh-TW') }
function rateLabel(){
  if(!RATE) return '匯率未取得，請手動輸入';
  const d=new Date(RATE.t), p=n=>String(n).padStart(2,'0');
  return (RATE.src==='manual'?'手動 ':'自動 ')+(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function updateConv(){
  const j=document.getElementById('jpy'); if(!j) return;
  const yen=parseFloat(String(j.value).replace(/[^0-9.]/g,''))||0;
  const r=RATE?RATE.r:0;
  document.getElementById('twd').textContent=r?fmtNT(yen*r):'—';
  document.getElementById('yref').innerHTML=r?[1000,3000,5000,10000].map(y=>'<span>¥'+y.toLocaleString('en')+' ≈ NT$'+fmtNT(y*r)+'</span>').join(''):'';
  document.getElementById('rsrc').textContent=rateLabel();
}
function bindConv(){
  const j=document.getElementById('jpy'), r=document.getElementById('rate'); if(!j) return;
  if(RATE) r.value=String(Math.round(RATE.r*10000)/10000);
  j.addEventListener('input',updateConv);
  r.addEventListener('change',()=>{
    const v=parseFloat(r.value); if(!(v>0)) return;
    RATE={r:v,t:Date.now(),src:'manual'}; try{ localStorage.setItem(RKEY,JSON.stringify(RATE)) }catch(e){}
    updateConv();
  });
  updateConv();
  if(!RATE || (RATE.src!=='manual' && Date.now()-RATE.t>6*3600e3)) fetchRate();
}
async function fetchRate(){
  try{
    const res=await fetch('https://open.er-api.com/v6/latest/JPY',{cache:'no-store'});
    const js=await res.json();
    if(js && js.rates && js.rates.TWD>0){
      RATE={r:js.rates.TWD,t:Date.now(),src:'auto'}; try{ localStorage.setItem(RKEY,JSON.stringify(RATE)) }catch(e){}
      const r=document.getElementById('rate'); if(r) r.value=String(Math.round(RATE.r*10000)/10000);
      updateConv();
    }
  }catch(e){}
}

/* ================= 彈出卡片 ================= */
function routeHTML(key){
  const r=ROUTES[key];
  const stn=(s,role)=>{
    const badge=role==='from'?'<span class="badge">上車</span>':role==='to'?'<span class="badge">下車</span>':'';
    return '<li class="st '+role+'"><span class="mk"></span><div class="snm"><span class="nmw"><b>'+esc(s[1])+'</b><small>'+
           (s[0]?esc(s[0])+' · ':'')+esc(s[2])+'</small></span>'+badge+'</div></li>';
  };
  let h='<div class="sh-head" style="--lc:'+r.color+'"><span class="lc"></span><div><div class="sh-t">'+esc(r.line)+'</div><div class="sh-s">'+r.dir+'</div></div></div>'+
        '<div class="sh-meta">'+esc(r.st[0][1])+' → '+esc(r.st[r.st.length-1][1])+' · '+(r.omit?'主要停靠站':(r.st.length-1)+' 站')+' · '+esc(r.time)+'</div>'+
        '<ol class="route'+(r.omit?' omit':'')+'" style="--lc:'+r.color+'">';
  if(r.pre) h+=stn(r.pre,'ext');
  r.st.forEach((s,j)=>{ h+=stn(s, j===0?'from':j===r.st.length-1?'to':'mid') });
  if(r.post) h+=stn(r.post,'ext');
  h+='</ol>';
  if(r.note) h+='<div class="sh-note">'+r.note+'</div>';
  if(r.link) h+='<div class="acts" style="margin-top:12px"><a class="pill map" target="_blank" rel="noopener" href="'+r.link+'">'+LINK+'Osaka Metro 官方全線圖</a></div>';
  return h;
}
function driverHTML(key){
  const H=HOTELS[key];
  return '<div class="drv"><div class="lbl">タクシーの運転手さんへ · 請給司機看</div>'+
         '<div class="jpn">'+esc(H.jp)+'</div>'+
         '<div class="addr">'+esc(H.addr)+'</div>'+
         '<div class="addr" style="font-size:16px;margin-top:6px">TEL '+esc(H.tel)+'</div>'+
         '<div class="ask">ここまでお願いします。</div><div class="zh">（請載我到這裡）</div>'+
         '<div class="acts" style="margin-top:16px">'+pillTel(H.tel)+pillGo(H.q,'transit','導航')+'</div></div>';
}
function openSheet(html){
  document.getElementById('sheetBody').innerHTML=html;
  const s=document.getElementById('sheet'); s.hidden=false; s.querySelector('.sheet-card').scrollTop=0;
  document.body.classList.add('locked');
}
function closeSheet(){ document.getElementById('sheet').hidden=true; document.body.classList.remove('locked') }
const sheetOpen=()=>!document.getElementById('sheet').hidden;

/* ================= 主流程 ================= */
function render(){
  renderNav();
  const v=document.getElementById('view');
  v.innerHTML = CUR<TRIP.length ? renderDay(CUR) : renderInfo();
  if(CUR===TRIP.length) bindConv();
}
function go(i){
  if(i<0 || i>TRIP.length || i===CUR) return;
  CUR=i; render();
  if(typeof window!=='undefined' && window.scrollTo){
    const nav=document.getElementById('nav'), top=nav.offsetTop||0;
    if(window.scrollY>top) window.scrollTo(0,top);
  }
}

function resetDone(){ if(confirm('要清除所有勾選嗎？')){ DONE={}; save(); render() } }

document.addEventListener('click',e=>{
  const box=e.target.closest('.box');
  if(box){
    const id=box.closest('.it').dataset.id;
    if(DONE[id]) delete DONE[id]; else DONE[id]=1;
    save(); render(); return;
  }
  const rt=e.target.closest('[data-rt]'); if(rt){ openSheet(routeHTML(rt.dataset.rt)); return }
  const dv=e.target.closest('[data-drv]'); if(dv){ openSheet(driverHTML(dv.dataset.drv)); return }
  if(e.target.closest('[data-close]') || e.target.id==='sheet') closeSheet();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && sheetOpen()) closeSheet();
  if((e.key===' '||e.key==='Enter') && e.target.classList && e.target.classList.contains('box')){ e.preventDefault(); e.target.click() }
});

/* 左右滑動換天 */
(function(){
  let x0=null,y0=0;
  const v=document.getElementById('view');
  v.addEventListener('touchstart',e=>{
    if(e.touches.length!==1 || e.target.closest('input')) { x0=null; return }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  v.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) go(CUR+(dx<0?1:-1));
  },{passive:true});
})();

/* 啟動：跳到今天，之後每 30 秒更新時間 */
RATE=loadRate();
(function(){ const i=todayIdx(); if(i>=0) CUR=i })();
countdown(); render();
setInterval(()=>{ countdown(); if(CUR===todayIdx() && !sheetOpen()) render() },30000);

/* 離線快取 */
if(typeof navigator!=='undefined' && 'serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
